trigger:
  branches:
    include:
      - dev

stages:
  - stage: Build
    displayName: Build React App
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: |
              cd react-azure-devops
              npm install
              npm run build
            displayName: 'Install & Build'

          # Fix 1: Explicitly zip the dist contents so Azure App Service extracts it cleanly
          - task: ArchiveFiles@2
            displayName: 'Archive build files'
            inputs:
              rootFolderOrFile: 'react-azure-devops/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/react-build.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/react-build.zip'
              artifact: 'react-build'

  - stage: Deploy_Dev
    displayName: Deploy to DEV
    dependsOn: Build
    jobs:
      - deployment: DeployDev
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: react-build

                # Fix 2: Point directly to the zip file and add deployment configurations
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    appType: 'webAppLinux' # Changed to webAppLinux since your screenshot shows Linux
                    appName: 'haseeb-react-dev'
                    package: '$(Pipeline.Workspace)/react-build/react-build.zip'
                    # This ensures Oryx/Azure knows to clean out old files (like hostingstart.html)
                    appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false'